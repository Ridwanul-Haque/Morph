# A pencil on the floor, for hand robots (in-hand goals start with it in the hand: Morph puts it there).
#
#   morph do examples/pencil "spin the pencil around the fingers without using the thumb" \
#     --robot third_party/mujoco_menagerie/shadow_hand/right_hand.xml

[project]
name = "pencil"
scene = "scene.xml"
object = "pencil"
robot = "../../third_party/mujoco_menagerie/shadow_hand/right_hand.xml"

[task]
description = "spin the pencil around the fingers without using the thumb"
